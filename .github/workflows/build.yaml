name: Build docker image

on:
  workflow_dispatch:  
  push:
    branches: [ "main" ]
    paths:
      - 'release-versions/zabbix-server-7.0-latest.txt'
      - Dockerfile
      - requirements.txt
  schedule:
    - cron: '40 2 * * 0'

permissions:
  contents: read

jobs:
  build_zabbix_server:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Zabbix version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < release-versions/zabbix-server-7.0-latest.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version string: '$VERSION'"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - name: 'Build:dockerimage'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          build-args: |
            ZBX_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/dark-vex/zabbix-server-mysql:latest
            ghcr.io/dark-vex/zabbix-server-mysql:ubuntu-${{ steps.version.outputs.minor }}
            ghcr.io/dark-vex/zabbix-server-mysql:${{ steps.version.outputs.version }}
            ghcr.io/dark-vex/zabbix-server-mysql:${{ steps.version.outputs.minor }}

      - name: Set up verified Wiz CLI
        uses: ./.github/actions/setup-wizcli

      - name: Image Scan
        id: scan
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
          IMAGE: ghcr.io/dark-vex/zabbix-server-mysql:${{ steps.version.outputs.version }}
        run: |
          wizcli scan container-image "$IMAGE"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io

      - name: Push image
        id: push
        env:
          IMAGE_NAME: ghcr.io/dark-vex/zabbix-server-mysql
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          set -euo pipefail

          for TAG in latest "ubuntu-$MINOR" "$VERSION" "$MINOR"; do
            docker push "$IMAGE_NAME:$TAG"
          done

          REF="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE_NAME:$VERSION" | grep "^${IMAGE_NAME}@" | head -n1)"
          DIGEST="${REF#*@}"

          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected digest format: '$DIGEST'"
            exit 1
          fi

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            ghcr.io/dark-vex/zabbix-server-mysql@${{ steps.push.outputs.digest }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
