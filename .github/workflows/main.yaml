name: Get latest release version
on:
  workflow_dispatch:
  schedule:
    - cron:  '10 1 * * *'
permissions: {}
jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Fetch release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(curl -sL --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/zabbix/zabbix-docker/releases?per_page=100" \
            | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^7\\.0\\.[0-9]+$"))' \
            | sort -V | tail -n 1)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Fetched an invalid/empty version string: '$VERSION'"
            exit 1
          fi
          echo "$VERSION" > release-versions/zabbix-server-7.0-latest.txt

      - name: Resolve base image digest
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < release-versions/zabbix-server-7.0-latest.txt)"
          DIGEST="$(docker buildx imagetools inspect "docker.io/zabbix/zabbix-server-mysql:ubuntu-${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Resolved an invalid base image digest: '$DIGEST'"
            exit 1
          fi
          echo "$DIGEST" > release-versions/zabbix-server-7.0-latest.digest

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: update/zabbix-server-7.0
          delete-branch: true
          commit-message: Update Zabbix 7.0 release version and base image digest
          committer: Daniele De Lorenzi <dark-vex@users.noreply.github.com>
          author: Daniele De Lorenzi <dark-vex@users.noreply.github.com>
          title: Update Zabbix 7.0 release version and base image digest
          body: |
            Automated update of `release-versions/zabbix-server-7.0-latest.txt`
            and `release-versions/zabbix-server-7.0-latest.digest` to the latest
            Zabbix 7.0 release and the current digest of its Ubuntu base image.

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
