name: Get latest release version
on:
  workflow_dispatch:
  schedule:
    - cron:  '10 1 * * *'
permissions:
  contents: write
  pull-requests: write
jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch release version
        run: |
          set -euo pipefail
          VERSION="$(curl -sL --fail \
            "https://api.github.com/repos/zabbix/zabbix-docker/releases?per_page=100" \
            | jq -r '[.[].tag_name | select(test("^7\\.0\\.[0-9]+$"))][0] // empty')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Fetched an invalid/empty version string: '$VERSION'"
            exit 1
          fi
          echo "$VERSION" > release-versions/zabbix-server-7.0-latest.txt

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: update/zabbix-server-7.0
          delete-branch: true
          commit-message: New release version
          committer: Daniele De Lorenzi <dark-vex@users.noreply.github.com>
          author: Daniele De Lorenzi <dark-vex@users.noreply.github.com>
          title: Update Zabbix 7.0 release version
          body: |
            Automated update of `release-versions/zabbix-server-7.0-latest.txt`
            to the latest Zabbix 7.0 release.

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
