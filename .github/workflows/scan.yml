name: Build, scan, push and upload sarif report

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 23 * * 1'

permissions:
  contents: read

jobs:

  build:

    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Read Zabbix version
      id: version
      run: |
        VERSION="$(tr -d '[:space:]' < release-versions/zabbix-server-7.0-latest.txt)"
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid version string: '$VERSION'"
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Build the Docker image
      # Tag image to be built
      # Change ${{ github.repository }} variable by another image name if you want but don't forget changing also image-tag below
      run: |
        docker build . --file Dockerfile \
          --build-arg ZBX_VERSION=${{ steps.version.outputs.version }} \
          --tag ghcr.io/dark-vex/zabbix-server-mysql:${{ steps.version.outputs.version }}

    - name: Set up verified Wiz CLI
      uses: ./.github/actions/setup-wizcli

    - name: Image Scan
      id: scan
      env:
        WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
        WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        WIZ_POLICIES: "[ddl] Default vulnerabilities policy"
      run: |
        wizcli scan container-image ghcr.io/dark-vex/zabbix-server-mysql:${{ steps.version.outputs.version }} --policies="$WIZ_POLICIES" --sarif-output-file=sarif.json

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      #Upload SARIF file
      if: (success() || failure()) && hashFiles('sarif.json') != ''
      with:
        sarif_file: ${{ github.workspace }}/sarif.json
